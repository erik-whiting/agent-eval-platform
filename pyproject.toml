[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-eval-platform"
version = "0.1.0"
description = "Configurable agent execution-policy evaluation scaffold"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
ui = ["gradio>=5,<7"]
# Proposed integration dependencies; adapters are extension points, not implemented clients.
integrations = ["langgraph>=1,<2", "langchain>=1,<2", "langsmith>=0.4,<1", "mcp>=1,<2"]

[project.scripts]
agent-eval = "agent_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
